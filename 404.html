<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kasey Feasts</title>
<script>
// GitHub Pages only has one real page (index.html). Clean links like
// kaseyfeasts.com/newengland/blog land here first; this sends them to the
// home page, which then puts the clean link back in the address bar.
// Do not delete this file.
(function (l) {
  l.replace(l.protocol + "//" + l.host + "/?p=" +
    encodeURIComponent(l.pathname.replace(/^\/+/, "") + l.search) + l.hash);
})(window.location);
</script>
</head>
<body></body>
</html>
